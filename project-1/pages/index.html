<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Home Page</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            height: 100vh;
            background: linear-gradient(135deg, #ffa07a, #ff7f50);
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }

        .home-container {
            text-align: center;
            background-color: rgba(0, 0, 0, 0.2);
            padding: 40px;
            border-radius: 15px;
            width: 90%;
            max-width: 700px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }

        h1 {
            font-size: 50px;
            margin-bottom: 20px;
        }

        p {
            font-size: 18px;
            line-height: 1.7;
            margin-bottom: 30px;
        }

        .btn-group {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 25px;
            text-decoration: none;
            border-radius: 8px;
            background-color: white;
            color: #ff7f50;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn:hover {
            background-color: #212121;
            color: white;
        }
    </style>
</head>

<body>
    <div class="home-container">
        <h1>Welcome to My Website</h1>

        <p>
            This is a simple Node.js multi-page website project.
            Explore different pages like About, Contact, and Services
            with a clean and modern UI design.
        </p>

        <div class="btn-group">
            <a href="/about" class="btn">About</a>
            <a href="/service" class="btn">Services</a>
            <a href="/contact" class="btn">Contact</a>
        </div>
    </div>
</body>
</html>
