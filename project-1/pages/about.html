<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>About Us</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #d8b07c, #b88655);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }

        .about-container {
            width: 80%;
            max-width: 700px;
            background-color: rgba(0, 0, 0, 0.25);
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }

        h1 {
            font-size: 45px;
            margin-bottom: 20px;
        }

        p {
            font-size: 18px;
            line-height: 1.7;
            color: #f5f5f5;
        }

        .btn {
            display: inline-block;
            margin-top: 25px;
            padding: 12px 25px;
            background-color: white;
            color: #b88655;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn:hover {
            background-color: #212121;
            color: white;
        }
    </style>
</head>

<body>
    <div class="about-container">
        <h1>About Us</h1>

        <p>
            Welcome to our website! We are passionate about creating
            simple, modern, and user-friendly web experiences.
            Our goal is to help developers learn and build amazing projects
            using HTML, CSS, JavaScript, and Node.js.
        </p>

        <a href="/" class="btn">Go to Home</a>
    </div>
</body>
</html>
